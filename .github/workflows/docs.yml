name: Documentation

# Builds the styled HTML documentation and publishes it to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The site is then served at
# https://ztachip.github.io/ztachip/

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'Documentation/**'
      - 'micropython/MicropythonUserGuide.md'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest
    name: 'Build documentation'

    steps:

      - name: '💾 Checkout'
        uses: actions/checkout@v4

      - name: '🛠️ Build HTML'
        run: sh tools/docs/build.sh

      - name: '📄 Configure Pages'
        uses: actions/configure-pages@v5

      - name: '📦 Upload artifact'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: 'Deploy to Pages'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: '🚀 Deploy'
        id: deployment
        uses: actions/deploy-pages@v4
